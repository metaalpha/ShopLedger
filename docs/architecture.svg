<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture diagram for the ShopLedger Node and Express point of sale application, including browser UI, server, routers, library modules, configuration, JSON data store, and numbered order placement flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 750; }
      .subtitle { font-size: 13px; fill: #64748b; }
      .section { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; fill: #64748b; }
      .box-title { font-size: 14px; font-weight: 750; }
      .box-text { font-size: 12px; fill: #475569; }
      .small { font-size: 11px; fill: #64748b; }
      .route-text { font-size: 11px; fill: #4c1d95; }
      .lib-text { font-size: 11px; fill: #334155; }
      .ticket-text { font-size: 11px; fill: #92400e; }
      .flow-num { font-size: 14px; font-weight: 800; fill: #ffffff; }
      .flow-text { font-size: 11px; fill: #78350f; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect x="24" y="20" width="1152" height="760" rx="18" fill="none" stroke="#cbd5e1"/>

  <text x="52" y="58" class="title">ShopLedger architecture</text>
  <text x="52" y="80" class="subtitle">Node/Express POS · Khata credit ledger · GST invoicing · verified repository modules only</text>

  <g transform="translate(730,40)">
    <rect x="0" y="0" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb"/>
    <text x="26" y="14" class="small">browser / server</text>
    <rect x="126" y="0" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="152" y="14" class="small">routes</text>
    <rect x="218" y="0" width="18" height="18" rx="4" fill="#f1f5f9" stroke="#64748b"/>
    <text x="244" y="14" class="small">library</text>
    <rect x="310" y="0" width="18" height="18" rx="4" fill="#fff7ed" stroke="#d97706"/>
    <text x="336" y="14" class="small">ticket focus</text>
  </g>

  <!-- Main architecture -->
  <text x="52" y="116" class="section">REQUEST / RESPONSE LAYER</text>

  <g filter="url(#shadow)">
    <rect x="52" y="132" width="198" height="176" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="70" y="158" class="box-title">Browser UI</text>
    <text x="70" y="180" class="box-text">public/</text>
    <text x="70" y="202" class="small">index.html</text>
    <text x="70" y="220" class="small">js/app.js</text>
    <text x="70" y="238" class="small">css/style.css</text>
    <text x="70" y="270" class="box-text">POS, order history,</text>
    <text x="70" y="287" class="box-text">Khata, audit views</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="286" y="132" width="198" height="176" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="304" y="158" class="box-title">Express entrypoint</text>
    <text x="304" y="180" class="box-text">server.js</text>
    <text x="304" y="204" class="small">bodyParser.json()</text>
    <text x="304" y="222" class="small">express.static(public)</text>
    <text x="304" y="240" class="small">app.use('/api', ...)</text>
    <text x="304" y="270" class="box-text">GET /orders/:id/invoice</text>
    <text x="304" y="287" class="box-text">→ invoice.render(order)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="132" width="226" height="176" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="538" y="158" class="box-title">API routers</text>
    <text x="538" y="181" class="route-text">routes/products.js</text>
    <text x="538" y="201" class="route-text">routes/orders.js</text>
    <text x="538" y="221" class="route-text">routes/customers.js</text>
    <text x="538" y="241" class="route-text">routes/reports.js</text>
    <text x="538" y="270" class="box-text">/products · /coupons</text>
    <text x="538" y="287" class="box-text">/orders · /customers · /reports</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="782" y="132" width="168" height="176" rx="12" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="800" y="158" class="box-title">Ticket focus</text>
    <text x="800" y="184" class="ticket-text">lib/invoice.js</text>
    <text x="800" y="204" class="ticket-text">computeInvoiceFigures()</text>
    <text x="800" y="224" class="ticket-text">render()</text>
    <text x="800" y="255" class="small">printable invoice path</text>
    <text x="800" y="273" class="small">reconciles with stored totals</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="986" y="132" width="158" height="176" rx="12" fill="#fefce8" stroke="#ca8a04"/>
    <text x="1004" y="158" class="box-title">Configuration</text>
    <text x="1004" y="184" class="box-text">config.js</text>
    <text x="1004" y="207" class="small">shop metadata</text>
    <text x="1004" y="225" class="small">tax.hsnSlabs</text>
    <text x="1004" y="243" class="small">coupons</text>
    <text x="1004" y="261" class="small">inventory defaults</text>
  </g>

  <path d="M250 220 H286" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M484 220 H520" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M746 220 H782" stroke="#d97706" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M950 220 H986" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="52" y="344" class="section">BUSINESS LOGIC / PERSISTENCE</text>

  <g filter="url(#shadow)">
    <rect x="52" y="360" width="694" height="146" rx="12" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="70" y="385" class="box-title">lib/ modules</text>

    <rect x="70" y="400" width="122" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="82" y="418" class="lib-text">pricing.js</text>
    <rect x="202" y="400" width="122" height="28" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="214" y="418" class="ticket-text">tax.js ★</text>
    <rect x="334" y="400" width="122" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="346" y="418" class="lib-text">coupons.js</text>
    <rect x="466" y="400" width="122" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="478" y="418" class="lib-text">inventory.js</text>
    <rect x="598" y="400" width="126" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="610" y="418" class="lib-text">orders.js</text>

    <rect x="70" y="446" width="122" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="82" y="464" class="lib-text">ledger.js</text>
    <rect x="202" y="446" width="122" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="214" y="464" class="lib-text">store.js</text>
    <rect x="334" y="446" width="122" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="346" y="464" class="lib-text">reports.js</text>
    <rect x="466" y="446" width="122" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="478" y="464" class="lib-text">dates.js</text>
    <rect x="598" y="446" width="126" height="28" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="610" y="464" class="ticket-text">invoice.js ★</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="782" y="360" width="362" height="146" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="800" y="385" class="box-title">JSON datastore</text>
    <text x="800" y="410" class="box-text">data/db.json</text>
    <text x="800" y="434" class="small">products · customers · orders</text>
    <text x="800" y="452" class="small">settlements · auditLog</text>
    <text x="800" y="480" class="small">read/write via lib/store.js</text>
  </g>

  <path d="M633 308 V360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M746 433 H782" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M950 308 V360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Numbered order flow -->
  <text x="52" y="545" class="section">ORDER PLACEMENT FLOW</text>
  <rect x="52" y="558" width="1092" height="174" rx="12" fill="#fffbeb" stroke="#f59e0b"/>

  <g>
    <circle cx="94" cy="600" r="16" fill="#b45309"/><text x="89" y="605" class="flow-num">1</text>
    <text x="120" y="596" class="box-title">POST /api/orders</text>
    <text x="120" y="614" class="flow-text">routes/orders.js</text>

    <circle cx="290" cy="600" r="16" fill="#b45309"/><text x="285" y="605" class="flow-num">2</text>
    <text x="316" y="596" class="box-title">Resolve products</text>
    <text x="316" y="614" class="flow-text">inventory.find(), check()</text>

    <circle cx="486" cy="600" r="16" fill="#b45309"/><text x="481" y="605" class="flow-num">3</text>
    <text x="512" y="596" class="box-title">Compute totals</text>
    <text x="512" y="614" class="flow-text">pricing.subtotal(), coupons.validate(),</text>
    <text x="512" y="630" class="flow-text">pricing.computeTotals() → tax.js</text>

    <circle cx="714" cy="600" r="16" fill="#b45309"/><text x="709" y="605" class="flow-num">4</text>
    <text x="740" y="596" class="box-title">Apply Khata</text>
    <text x="740" y="614" class="flow-text">ledger.chargeOrderToKhata()</text>

    <circle cx="924" cy="600" r="16" fill="#b45309"/><text x="919" y="605" class="flow-num">5</text>
    <text x="950" y="596" class="box-title">Commit stock</text>
    <text x="950" y="614" class="flow-text">inventory.reserve()</text>

    <circle cx="304" cy="684" r="16" fill="#b45309"/><text x="299" y="689" class="flow-num">6</text>
    <text x="330" y="680" class="box-title">Save order</text>
    <text x="330" y="698" class="flow-text">orders.add() + store.appendAudit() + store.write()</text>

    <circle cx="768" cy="684" r="16" fill="#b45309"/><text x="763" y="689" class="flow-num">7</text>
    <text x="794" y="680" class="box-title">Printable invoice</text>
    <text x="794" y="698" class="flow-text">server.js → invoice.render() → computeInvoiceFigures()</text>
  </g>

  <path d="M110 648 H270" stroke="#b45309" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M306 648 H470" stroke="#b45309" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M506 648 H698" stroke="#b45309" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M734 648 H908" stroke="#b45309" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M924 632 C924 660 880 675 802 680" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#flowArrow)"/>
  <path d="M748 680 H340" stroke="#b45309" stroke-width="2" marker-end="url(#flowArrow)"/>

  <text x="52" y="760" class="small">★ Ticket focus: invoice.js is highlighted; tax.js is highlighted because checkout GST resolution depends on it.</text>
</svg>
